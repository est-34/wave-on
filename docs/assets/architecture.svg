<svg xmlns="http://www.w3.org/2000/svg" width="1568" height="452" viewBox="0 0 1568 452" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
  <title id="title">SilentOrchestra 2.0 시스템 아키텍처</title>
  <desc id="desc">브라우저와 선택적 Python 웹캠 클라이언트가 모션 특징과 맥락을 HTTP로 전달합니다. 단일 FastAPI 서버의 agent, identity, demo 모듈은 도메인과 유스케이스를 포함합니다. 저장소와 OS 어댑터는 코어의 포트를 구현하고 bootstrap.py와 main.py가 구현을 연결합니다. SQLite 또는 PostgreSQL에 특징과 학습 기억을 저장하며, 명시적으로 활성화한 경우에만 로컬 OS 동작을 수행합니다. 화살표는 주요 실행 흐름이며 소스 의존성이 아닙니다. 원본 프레임은 저장하거나 전송하지 않습니다.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #1A2028; }
    .heading { font-size: 27px; font-weight: 700; }
    .subtitle { font-size: 19px; fill: #525862; }
    .body { font-size: 19px; }
    .label { font-size: 18px; font-weight: 700; fill: #526FA8; }
    .role { font-size: 17px; font-weight: 700; fill: #526FA8; }
    .icon { fill: none; stroke: #526FA8; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1568" height="452" rx="16" fill="#EEF2F8"/>
