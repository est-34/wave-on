name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e "./backend[dev]"
      - run: python -m pytest backend/tests
      - run: >-
          python backend/scripts/validate_sqlite.py
          --schema backend/sql/schema.sql
          --seed backend/sql/seed.sql
          --queries backend/sql/queries.sql
          --tests backend/sql/tests.sql
          --report /tmp/sqlite-validation.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test frontend/tests/*.test.cjs
